# Training and evaluation settings (package `training`): data, labels, augmentation, training and
# evaluation targets. Never used on the device. Stress protocol: training/evaluate.py.
# Paths are relative to the project root. Device settings: configs/device.yml.


# ── 1. DATA ──────────────────────────────────────────────────────────────────────────────────────

paths:
  manifest: data/sq5_sweep_core500_20261008/manifest.csv
  wav_dir: data/sq5_sweep_core500_20261008/wavs
  ecg_dir: data/sq5_sweep_core500_20261008/ecg
  split_manifest: output/splits/split_v1.csv
  labels: output/labels/ecg_labels.csv     # label table written by `hr-estimation prepare`
  runs_dir: output/runs
  models_dir: models                       # model files; released ones tracked in git
  cache_dir: output/cache
  golden_dir: output/golden                # frozen readings for the regression test

data:
  reference_column: efast_ecg_heart_rate   # EFAST ECG HR; the consensus ECG HR replaces it
                                           # where the ECG is trusted (labels)
  max_duration_s: 17.0                     # longer recordings truncated
  seed: 20261031                           # split and training

split:                                     # by clinician account, balanced over heart rates
  train: 0.5                               # share of recordings: training
  val: 0.2                                 # validation (tuning, calibration)
  test: 0.3                                # test (once per agreed candidate)
  group_column: user_id                    # one account never in two splits
  stratify_bin_bpm: 5                      # each split gets a similar mix of 5 BPM bins


# ── 2. TRAINING AND EVALUATION ───────────────────────────────────────────────────────────────────

workers: 16                                # parallel processes for training and evaluation

training:
  net:                                     # TCN
    periodicity_window_s: [2.0, 4.0]       # loss window drawn per batch
    crop_s: 4.0                            # length of each training example
    batch: 32                              # examples per batch
    epochs: 40                             # passes over the training set
    lr: 0.003                              # Adam learning rate
  scorer:
    positive_tol_rel: 0.03                 # target: states within 3 % of the target HR
    dense_until_s: 5.0                     # training frames every 0.25 s up to here,
    sparse_step_s: 1.0                     # then one per second
    epochs: 12                             # passes over the training frames
    batch_frames: 256                      # frames per batch
    lr: 0.003                              # Adam learning rate
    weight_decay: 0.0001                   # Adam weight decay

augment:                                   # training split only
  copies: 4                                # augmented copies per training recording (0: none)
  seed: 11                                 # random draws of the copies
  warp_rr_cv_max: 0.10                     # time warp only regular ECG beats: interval CV max
  warp_rr_dev_max: 0.25                    # and largest interval deviation from the median
  p_fast: 0.15                             # sped up (whole signal) to fast_target_bpm
  fast_target_bpm: [200, 300]              # log-uniform target HR of a speed-up
  speed_max: 2.0                           # at most this speed-up factor
  p_warp: 0.7                              # otherwise time-warped with this probability
  p_slow: 0.35                             # share of warps aimed at slow hearts
  target_bpm: [30, 220]                    # log-uniform target HR
  slow_target_bpm: [30, 50]                # target HR of the slow warps
  hr_factor_range: [0.45, 1.8]             # target / original HR
  keep_s: 0.5                              # unwarped part after each R-peak (S1, systole, S2)
  keep_frac: 0.65                          # at most this share of the cycle
  min_diastole_s: 0.08                     # shortest warped diastole
  p_jitter: 0.25                           # share of warps with per-beat jitter
  jitter_cv: [0.03, 0.15]                  # per-beat interval variation (irregular rhythm)
  p_noise: 0.8                             # share of copies with added noise
  noise_types: [white, hum, breath]        # friction held out for the stress test
  snr_db: [0, 25]                          # noise level, uniform
  gain_db: [-12, 12]                       # gain of every copy, uniform
  p_tilt: 0.5                              # share of copies with spectral tilt
  tilt_alpha: [0.3, 1.0]                   # share of the original signal in the tilt mix
  tilt_cutoff_hz: 150                      # first-order low-pass of the tilt

labels:                                    # ECG reference (offline; never an estimator input)
  leads: [_ECG, _ECG_1, _ECG_2]            # ECG file suffixes: leads 1-3
  detectors: [neurokit, pantompkins1985, hamilton2002, elgendi2010, kalidas2017]  # NeuroKit2
  match_tol_s: 0.075                       # detections of one beat agree within this
  min_detectors: 3                         # a beat of a lead: found by this many detectors
  min_leads: 2                             # a beat of the recording: found on this many leads
  gap_ratio: 1.6                           # longer gaps filled with beats found on one lead
  lead_f1_min: 0.9                         # trusted: min_leads leads match the recording's beats
  min_beats: 4                             # trusted: at least this many beats ...
  rr_range_s: [0.25, 2.2]                  # ... with every R-R interval in this range (27-240 BPM)
  window_s: 4.0                            # reference of a reading: ECG HR over the last 4 s,
  min_intervals: 3                         # widened to hold at least 3 beat intervals
  unheard_ratio: 1.5                       # ECG HR >= 1.5x EFAST: beats not heard (own group)

eval:
  fine_bpm: 3.0                            # accurate: within ±3 BPM of the ECG, same seconds
  rough_bpm: 10.0                          # rough: within ±10 BPM
  half_double_rel: 0.15                    # half/double: within 15 % of 0.5x or 2x
  tolerance_bpm: 5.0                       # EC13 (against the EFAST ECG HR, ungraded recordings):
  tolerance_rel: 0.10                      # within max(5 BPM, 10 %)
  af_rhythm: Atrial Fibrillation           # EFAST rhythm class counted as irregular
  buckets:                                 # from the ECG; evaluation only
    regular_max_cv: 0.05                   # regular: beat-interval SD / mean below this
    slow_bpm: 50                           # slow: regular and below this
    fast_bpm: 200                          # very fast: regular and above this (stress cases)
  curve_times_s: [2, 3, 4, 5, 6, 8, 9, 10] # reading on show checked at these times

targets:                                   # pass/fail per bucket (agreed 2026-11-07); time (_s)
  regular_common:                          # and half/double targets are maxima, others minima
    ttfr_median_s: 3.0
    ttfr_p90_s: 4.0
    first_within_fine: 0.92
    within_fine_at_4s: 0.92
  slow:
    ttfr_median_s: 5.0
    first_within_rough: 0.95
    within_fine_at_9s: 0.90
  irregular:
    ttfr_median_s: 6.0
    first_within_rough: 0.90
    within_fine_at_9s: 0.60
  very_fast:                               # checked on the stress run (sped-up recordings)
    first_within_rough: 0.90
    half_double_readings: 0.01
  all:
    reading_by_10s: 0.99
    half_double_readings: 0.005
