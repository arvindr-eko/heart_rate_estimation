# Device settings: everything the stethoscope runs (package `device`, ported 1:1 to C).
#   1. USER SETTINGS   safe to change at any time; no retraining
#   2. ALGORITHM       fixed by the trained model; change only with retraining or re-validation
# Training, data and evaluation settings: configs/training.yml.


# ── 1. USER SETTINGS ─────────────────────────────────────────────────────────────────────────────

readout:                       # when the first reading appears; changing these needs no retraining
  confidence: 0.7              # regular hearts: how sure before the first reading (probability of
                               # being within ±3 BPM, measured on validation); lower: sooner
  slow_irregular_after_s: 3.0  # slow or irregular hearts: first reading not before this time
                               # (decision.slow_irregular_early_confidence until
                               # decision.slow_irregular_relaxed_s, then slow_irregular_confidence)
  latest_s: 8.0                # heart sound present: a first reading at this time when the
                               # estimate is roughly certain (decision.forced_min_mass)


# ── 2. ALGORITHM (fixed by the trained model) ────────────────────────────────────────────────────

weights: hr_v9c                            # models/hr_v9c_*.npz: TCN, scorer, calibration

stream:
  fs_hz: 4000                              # PCG sample rate
  block_samples: 200                       # 50 ms per input block
  frame_blocks: 5                          # tracker update every 5 blocks = 0.25 s
  output_period_s: 1.0                     # one reading per second after the first

frontend:                                  # block A
  bands_hz: [[25, 50], [50, 100], [100, 200], [200, 400], [400, 800], [800, 1600]]  # band-passes
  heart_bands: 4                           # first bands (25-400 Hz): log energy, running mean
                                           # removed; bands above: ln(E band / E heart bands)
  filter_order: 2                          # Butterworth order per band edge
  env_rate_hz: 100                         # one value per input every 10 ms
  source_features: true                    # voicing and impulsiveness as TCN inputs
  voicing_from_hz: 100                     # source signal: sum of the bands from here up
  voicing_lag_ms: [2.5, 12.0]              # voicing: highest NCCF over these lags (83-400 Hz pitch)
  impulse_window_ms: 1.0                   # impulsiveness: ln(peak energy over this / mean), 10 ms

net:                                       # block B, causal TCN
  norm_tau_s: 1.0                          # running-mean time constant of the input
  channels: 8                              # channels of every layer
  kernel: 3                                # taps per causal convolution
  dilations: [1, 2, 4, 8, 16]              # receptive field 63 frames = 0.63 s

features:                                  # block C
  window_s: 4.0                            # longest analysis window
  min_window_s: 1.0                        # no features before this
  min_overlap_s: 0.8                       # NCCF valid only with this much overlap
  s1_window_s: 2.0                         # 25-50 Hz (S1) band: window of its features,
  s1_decimation: 2                         # stored at 100 / 2 = 50 Hz
  s1_max_bpm: 250                          # band features used for candidate rates up to this

grid:                                      # candidate heart rates: 232 states, 1 % apart
  hr_min_bpm: 30                           # lowest candidate rate
  hr_max_bpm: 300                          # upper bound (highest state 298.8 BPM)
  step_rel: 0.01                           # relative spacing of the states

scorer:                                    # block D
  emission_beta: 0.35                      # weight of the scorer in the tracker
  hidden: 16                               # hidden units of the scorer MLP

tracker:                                   # block E
  sigma_rel_per_sqrt_s: 0.08               # HR drift, relative, per sqrt(second)
  octave_prob: 0.002                       # chance per update of a jump to double or half
  floor_prob: 0.0005                       # uniform re-initialisation per update
  estimate_tol_rel: 0.05                   # estimate window and frame agreement, ±5 %

rhythm:                                    # block R: beats picked from the activation
  peak_min_rel: 0.4                        # local maxima of at least this x the window maximum
  refractory_rel: 0.6                      # beats at least this x the estimate's period apart
  min_intervals: 2                         # interval CV and beat-count HR need this many

quality:                                   # block Q, signal quality (10 ms envelope)
  hf_tau_s: 0.5                            # averaging of the 25-100 Hz and 200-400 Hz energies
  hf_max: 1.0e+30                          # heart present only with ln(E high / E low) at or
  hf_lost: 1.0e+30                         # below hf_max; after the first reading, above hf_lost:
                                           # no heartbeat (1e30: no hard gate, presence gate only)

decision:                                  # block F, internal (re-validate when changed)
  min_s: 1.5                               # no reading before this time
  slow_bpm: 50                             # below: slow path
  regular_max_cv: 0.10                     # picked-beat interval CV at or above: irregular path
  slow_irregular_confidence: 0.9           # slow/irregular path: probability within ±10 BPM
  slow_irregular_early_confidence: 0.97    # slow/irregular path before slow_irregular_relaxed_s:
  slow_irregular_relaxed_s: 4.0            # this probability within ±10 BPM is needed
  conf_fine_bpm: 4.0                       # confidence of a regular reading: mass within ±4 BPM
  conf_rough_bpm: 10.0                     # slow/irregular reading and forced reading: ±10 BPM
  forced_min_mass: 0.3                     # forced reading at latest_s only above this mass
  min_periodicity: 0.2                     # no reading below this ACF at the estimate's period
  min_activation_sd: 0.03                  # no reading below this activation SD (silence, hum)
  lost_periodicity: 0.15                   # after the first reading, a frame without heartbeat:
                                           # ACF below this (lower than min_periodicity, so
                                           # irregular rhythms stay) or SD below min_activation_sd
  lost_after_s: 2.0                        # this long without heartbeat in a row: the
                                           # measurement restarts by itself
  idle_s: 2.0                              # before the first reading: this long with the
  idle_activation: 0.4                     # activation below this (no heartbeat), the analysis
                                           # restarts every frame until it rises (front end
                                           # and network keep running)
  recent_s: 1.5                            # recent heartbeat: correlation of the last
                                           # recent_s (at least one period + recent_overlap_s)
  recent_overlap_s: 0.5                    # with itself one period earlier,
  recent_tol_rel: 0.15                     # best lag within ±15 % of the estimate's period
  recent_min: 0.0                          # heart present (first reading, updates) at or above
  recent_lost: 0.2                         # after the first reading: below this, no heartbeat
  confirm_s: 1.0                           # first reading only after this long of heart present
  presence_min: 0.6                        # learned heart-present gate (readout.presence,
                                           # <weights>_presence.npz): present at or above this
  presence_lost: 0.3                       # after the first reading: below this, no heartbeat
